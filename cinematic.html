<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:IB;src:url(/InterDisplay-Black.otf)}
@font-face{font-family:IBD;src:url(/InterDisplay-Bold.otf)}
@font-face{font-family:IM;src:url(/Inter-Medium.otf)}
@font-face{font-family:MO;src:url(/DejaVuSansMono.ttf)}
@font-face{font-family:LO;src:url(/Lora-Italic.ttf)}
:root{--gold:#ffcf5a;--gold2:#c8912e;--paper:#ece6d8;--bg:#0c0a07}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:#fff;font-family:IM}
#cam{position:absolute;inset:0;transform-origin:50% 48%}
.beat{position:absolute;inset:0;display:none}
.center{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.small{font:64px LO;color:#eadcbd;opacity:.92;margin-bottom:26px;text-align:center;padding:0 80px;line-height:1.15}
.big{font:178px IB;letter-spacing:3px;line-height:.95;text-align:center;white-space:nowrap;transform-origin:50% 50%}
.gold{background:linear-gradient(100deg,#9c6b1e 0%,#e8b54a 30%,#fff3cf 46%,#ffe7a6 52%,#e8b54a 66%,#9c6b1e 100%);background-size:320% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(255,185,70,.42)) drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.chrome{background:linear-gradient(180deg,#ffffff 0%,#d9dde2 38%,#4a4d52 50%,#a9aeb4 62%,#f4f4f4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #222) drop-shadow(0 4px 0 #161616) drop-shadow(0 8px 0 #0e0e0e) drop-shadow(0 22px 30px rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(255,200,120,.25))}
.ink{color:#121110}
.echo{position:absolute;left:0;right:0;text-align:center;font:178px IB;letter-spacing:3px;white-space:nowrap;color:transparent;-webkit-text-stroke:3px rgba(255,207,90,.55)}
.paper{position:absolute;inset:0;background:var(--paper)}
#dust,#fx,#grain{position:absolute;inset:0;pointer-events:none}
#grain{opacity:.16;mix-blend-mode:overlay;image-rendering:pixelated}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 50% 48%,transparent 55%,rgba(0,0,0,.75) 100%);pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none;font:22px MO;letter-spacing:3px;color:rgba(234,220,189,.55)}
.c{position:absolute;width:40px;height:40px;border-color:rgba(234,220,189,.5);border-style:solid}
.node{width:190px;display:flex;flex-direction:column;align-items:center;gap:18px}
.nbox{width:120px;height:120px;border-radius:22px;border:3px solid rgba(255,207,90,.35);display:flex;align-items:center;justify-content:center;font:46px IB;color:rgba(255,207,90,.5);background:rgba(255,207,90,.03)}
.nlab{font:30px IBD;color:rgba(234,220,189,.55);text-align:center;white-space:nowrap}
.pbox{width:880px;border-radius:26px;border:2px solid rgba(255,207,90,.6);background:rgba(20,16,10,.9);padding:34px 38px;box-sizing:border-box;box-shadow:0 0 50px rgba(255,190,70,.2)}
.pill{display:inline-block;background:var(--gold);color:#1a1205;font:24px IBD;padding:8px 18px;border-radius:30px;margin-bottom:22px}
.ptxt{font:40px IM;color:#f3ead6;min-height:150px;line-height:1.3}
.ptxt u{text-decoration:none;background:rgba(255,207,90,.25);color:#ffe7a6}
.btn{margin-top:22px;float:right;background:var(--gold);color:#1a1205;font:30px IBD;padding:18px 34px;border-radius:16px}
#hook{position:absolute;inset:0;z-index:20;display:none;background:#000}
#hook video{width:1080px;height:1920px;object-fit:cover;display:block}
#hooktxt{position:absolute;left:50px;right:50px;top:300px;text-align:center;font:96px IB;letter-spacing:-2px;line-height:1.02;color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill}
#hooktxt em{font-style:normal;color:var(--gold)}
#sub{position:absolute;left:80px;right:80px;top:1400px;text-align:center;font:50px LO;color:rgba(234,220,189,.8);line-height:1.2}
#sub b{font-weight:normal;color:#fff3cf}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--gold);box-shadow:0 0 14px var(--gold);z-index:21}
</style></head><body>
<div id="cam"><canvas id="dust" width="1080" height="1920"></canvas><div id="beats"></div><canvas id="fx" width="1080" height="1920"></canvas></div>
<div id="vig"></div><canvas id="grain" width="270" height="480" style="width:1080px;height:1920px"></canvas>
<div id="hud"><div class="c" style="left:60px;top:150px;border-width:3px 0 0 3px"></div><div class="c" style="right:60px;top:150px;border-width:3px 3px 0 0"></div>
<div class="c" style="left:60px;bottom:150px;border-width:0 0 3px 3px"></div><div class="c" style="right:60px;bottom:150px;border-width:0 3px 3px 0"></div>
<div style="position:absolute;left:70px;top:210px"><span style="color:var(--gold)">●</span> OWN THE INBOX</div><div id="tc" style="position:absolute;right:70px;top:210px">00:00:00</div>
<div id="sc" style="position:absolute;left:70px;bottom:205px">SCENE 01</div><div id="lb" style="position:absolute;right:70px;bottom:205px">KLAVIYO / E-MAIL</div></div>
<div id="sub"></div><div id="hook"><video id="hookv" muted playsinline preload="auto"></video><div id="hooktxt"></div></div><div id="prog"></div>
<script>
const Q = new URLSearchParams(location.search), REEL = Q.get('reel'), TIMING = Q.get('timing');
const cl = x => Math.max(0, Math.min(1, x)), lerp = (a, b, t) => a + (b - a) * t;
const eOut = t => 1 - Math.pow(1 - cl(t), 3), eIO = t => { t = cl(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2 };
const back = t => { t = cl(t); const c = 1.6; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2) };
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rnd = s => { s = Math.sin(s * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s) };
window.__HITS = {}; const hit = (t, d) => { const k = t.toFixed(3); window.__HITS[k] = Math.min(window.__HITS[k] ?? 99, d) };
const norm = w => w.toLowerCase().normalize('NFD').replace(/[^a-z0-9%€]/g, '');
let B = [], WORDS = [], DUR = 0, HOOK = null, END = null;

// time a phrase is spoken inside a beat (first word match), else fallback
function spokenAt(beat, phrase, fb) {
  const first = norm((phrase || '').split(/\s+/)[0] || ''); if (!first) return fb;
  const w = WORDS.find(w => w.beat === beat && norm(w.w) === first) || WORDS.find(w => w.beat === beat && norm(w.w).startsWith(first.slice(0, 4)));
  return w ? w.s : fb;
}
function fit(el, max) { el.style.transform = ''; const w = el.scrollWidth; return w > max ? max / w : 1 }

async function init() {
  for (const f of ['IB', 'IBD', 'IM', 'MO', 'LO']) await document.fonts.load(`40px ${f}`);
  const cfg = await (await fetch('/' + REEL + '/reel.json')).json();
  const tm = await (await fetch('/' + TIMING)).json();
  WORDS = tm.words; DUR = tm.duration; HOOK = tm.hook || null;
  if (HOOK) { const v = document.getElementById('hookv'); v.src = HOOK.src;
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('hook video failed')); v.load() });
    const ws = (HOOK.text || '').split(' '); document.getElementById('hooktxt').innerHTML = ws.map((w, i) => i === ws.length - 1 ? `<em>${esc(w)}</em>` : esc(w)).join(' ') }
  const host = document.getElementById('beats');
  cfg.beats.forEach((b, i) => {
    const t0 = tm.beats[i].start, t1 = tm.beats[i].end, st = b.style || 'title', el = document.createElement('div'); el.className = 'beat';
    const x = { i, b, st, t0, t1, el };
    let h = '';
    const bigCls = st === 'chrome' ? 'chrome' : st === 'flash' ? 'ink' : 'gold';
    if (st === 'flash') h += `<div class="paper"></div>`;
    if (st === 'diagram') {
      h += `<div class="center">${b.small ? `<div class="small" data-small>${esc(b.small)}</div>` : ''}<div style="position:relative;display:flex;gap:30px;margin-top:40px" data-row>` +
        b.items.map((it, k) => `<div class="node" data-node="${k}"><div class="nbox">${esc(it.icon || (k + 1))}</div><div class="nlab">${esc(it.label)}</div></div>`).join('') +
        `<svg data-line style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" width="10" height="10"><path fill="none" stroke="#ffcf5a" stroke-width="5" stroke-linecap="round" style="filter:drop-shadow(0 0 10px #ffb84a)"/></svg></div></div>`;
    } else if (st === 'prompt') {
      h += `<div class="center">${b.small ? `<div class="small" data-small>${esc(b.small)}</div>` : ''}<div class="pbox"><div class="pill">✦ ${esc(b.tool || 'Klaviyo AI')}</div><div class="ptxt" data-ptxt></div><div class="btn" data-btn>${esc(b.button || 'Genereer →')}</div><div style="clear:both"></div></div></div>`;
    } else {
      const bigs = (b.big || '').split('|');
      h += `<div class="center">${b.small ? `<div class="small" data-small>${esc(b.small)}</div>` : ''}<div data-bigwrap style="position:relative">` +
        (st === 'echo' ? [-3, -2, -1, 1, 2, 3].map(k => `<div class="echo" data-echo="${k}" style="top:0">${esc(bigs.join(' '))}</div>`).join('') : '') +
        bigs.map((l, k) => `<div class="big ${bigCls}" data-big="${k}">${esc(l)}</div>`).join('') + `</div></div>`;
    }
    el.innerHTML = h; host.appendChild(el);
    x.small = el.querySelector('[data-small]'); x.bigs = [...el.querySelectorAll('[data-big]')]; x.echos = [...el.querySelectorAll('[data-echo]')];
    x.nodes = [...el.querySelectorAll('[data-node]')]; x.ptxt = el.querySelector('[data-ptxt]'); x.btn = el.querySelector('[data-btn]');
    // timings
    x.tSmall = b.small ? spokenAt(i, b.small, t0 + .15) - .05 : null;
    const bigs = (b.big || '').split('|');
    x.tBig = bigs.map((l, k) => Math.max(t0 + .05, spokenAt(i, l, t0 + .35 + k * .45) - .04));
    x.tNode = (b.items || []).map((it, k) => spokenAt(i, it.label, t0 + .4 + k * Math.min(.7, (t1 - t0 - .8) / Math.max(1, b.items.length))));
    if (st === 'prompt') { x.pt0 = t0 + .25; x.pt1 = Math.min(t1 - .9, x.pt0 + Math.max(1.2, (b.prompt || '').length * .045)); x.tBtn = x.pt1 + .25 }
    B.push(x);
  });
  B.forEach(x => { x.el.style.display = 'block';
    x.bigs.forEach(e => { e.dataset.fit = fit(e, x.st === 'flash' ? 980 : 940) });
    x.echos.forEach(e => { e.dataset.fit = fit(e, 940) });
    if (x.st === 'diagram') { const row = x.el.querySelector('[data-row]'), r0 = row.getBoundingClientRect();
      const pts = x.nodes.map(n => { const r = n.querySelector('.nbox').getBoundingClientRect(); return [r.left - r0.left + r.width / 2, r.top - r0.top + r.height / 2] });
      x.pts = pts; const p = x.el.querySelector('[data-line] path'); p.setAttribute('d', pts.map((q, k) => `${k ? 'L' : 'M'}${q[0]},${q[1]}`).join(' ')); x.path = p; x.plen = p.getTotalLength() || 1 }
    x.el.style.display = 'none' });
  if (cfg.cta) { const el = document.createElement('div'); el.className = 'beat';
    el.innerHTML = `<div class="center"><div class="small">${esc(cfg.cta.kicker || 'Reageer met')}</div><div class="big gold" data-cta style="font-size:210px">${esc(cfg.cta.word)}</div><div class="small" style="margin-top:30px;font-size:46px">${esc(cfg.cta.sub || '')}</div></div>`;
    host.appendChild(el); END = { el, t0: tm.end_start, w: el.querySelector('[data-cta]') }; }
  // sounds: slam = boom (5) / thud (9), nodes = tick, typing = tick, button = click
  B.forEach(x => {
    x.tBig.forEach((t, k) => hit(t, x.st === 'flash' || k === x.tBig.length - 1 ? 5 : 9));
    x.tNode.forEach(t => hit(t, 18));
    if (x.st === 'prompt') { for (let t = x.pt0; t < x.pt1; t += .16) hit(t, 20); hit(x.tBtn, 13) }
    if (x.st === 'streak') hit(x.t0 + .05, 30);
  });
  if (END) hit(END.t0 + .05, 5);
  window.READY = true;
}

const dust = Array.from({ length: 140 }, (_, i) => ({ x: rnd(i) * 1080, y: rnd(i + 99) * 1920, s: 1 + rnd(i + 7) * 3, v: 6 + rnd(i + 3) * 18, p: rnd(i + 5) * 6.28 }));
function drawDust(t) { const c = document.getElementById('dust').getContext('2d'); c.clearRect(0, 0, 1080, 1920);
  for (const d of dust) { const y = (d.y - t * d.v + 1920 * 4) % 1920, x = d.x + Math.sin(t * .4 + d.p) * 30, a = .25 + .35 * Math.sin(t * 1.3 + d.p) ** 2;
    c.fillStyle = `rgba(255,205,120,${a})`; c.beginPath(); c.arc(x, y, d.s, 0, 6.28); c.fill() } }
function drawGrain(t) { const c = document.getElementById('grain').getContext('2d'), im = c.createImageData(270, 480), f = Math.floor(t * 24);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd(i * .37 + f * 13.1) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255 } c.putImageData(im, 0, 0) }
function sparks(c, x0, y0, t, seed) { // burst of sparks at (x0,y0), t seconds after start
  if (t < 0 || t > 1.2) return;
  for (let k = 0; k < 46; k++) { const a = rnd(seed + k) * 6.28, v = 300 + rnd(seed + k * 3) * 900, life = .5 + rnd(seed + k * 7) * .7; if (t > life) continue;
    const x = x0 + Math.cos(a) * v * t, y = y0 + Math.sin(a) * v * t + 500 * t * t, al = 1 - t / life;
    c.strokeStyle = `rgba(255,${200 + 55 * al | 0},120,${al})`; c.lineWidth = 3; c.beginPath(); c.moveTo(x, y); c.lineTo(x - Math.cos(a) * 26 * al, y - (Math.sin(a) * 26 - 30 * t) * al); c.stroke() } }

window.renderAt = t => {
  document.getElementById('prog').style.width = cl(t / DUR) * 1080 + 'px';
  const s = Math.floor(t), fr = Math.floor((t - s) * 30);
  document.getElementById('tc').textContent = `00:${String(s).padStart(2, '0')}:${String(fr).padStart(2, '0')}`;
  drawDust(t); drawGrain(t);
  const fx = document.getElementById('fx').getContext('2d'); fx.clearRect(0, 0, 1080, 1920);
  let punch = 0, cur = null;
  B.forEach((x, i) => {
    const on = t >= x.t0 && t < (i + 1 < B.length ? B[i + 1].t0 : (END ? END.t0 : 1e9)); x.el.style.display = on ? 'block' : 'none'; if (!on) return; cur = x;
    const a = t - x.t0;
    if (x.small) { const q = eOut((t - x.tSmall) / .5); x.small.style.opacity = q; x.small.style.transform = `translateY(${(1 - q) * 24}px)`; x.small.style.filter = `blur(${(1 - q) * 8}px)` }
    x.bigs.forEach((e, k) => { const tb = x.tBig[k], q = (t - tb), f = +e.dataset.fit;
      if (q < 0) { e.style.opacity = 0; return }
      punch = Math.max(punch, 1 - q / .35);
      let sc, op = cl(q / .06), extra = '';
      if (x.st === 'chrome') { sc = lerp(1.6, 1, eOut(q / .3)); extra = ` perspective(900px) rotateX(${lerp(40, 12, eOut(q / .5))}deg)` }
      else if (x.st === 'streak') { sc = 1; e.style.clipPath = `inset(0 ${(1 - eIO(q / .7)) * 100}% 0 0)` }
      else sc = lerp(1.45, 1, eOut(q / .28));
      sc *= 1 + Math.min(q, 4) * .012;
      e.style.opacity = op; e.style.transform = `scale(${sc * f})${extra}`;
      if (e.classList.contains('gold')) e.style.backgroundPosition = `${lerp(100, 0, eIO((q - .15) / .9))}% 0` });
    x.echos.forEach(e => { const k = +e.dataset.echo, q = eOut((t - x.tBig[0] - .08) / .6), f = +e.dataset.fit;
      e.style.transform = `translateY(${k * 128 * q}px) scale(${f})`; e.style.opacity = q * (1 - Math.abs(k) * .26) });
    if (x.st === 'streak') { const q = eIO(a / .7), y = 960, hx = lerp(-80, 1160, q);
      const g = fx.createLinearGradient(hx - 700, 0, hx, 0); g.addColorStop(0, 'rgba(255,190,80,0)'); g.addColorStop(1, 'rgba(255,230,170,.95)');
      if (a < 1.1) { fx.strokeStyle = g; fx.lineWidth = 4; fx.beginPath(); fx.moveTo(Math.max(0, hx - 700), y + 110); fx.lineTo(hx, y + 110); fx.stroke();
        const rg = fx.createRadialGradient(hx, y + 110, 0, hx, y + 110, 120); rg.addColorStop(0, 'rgba(255,245,210,.95)'); rg.addColorStop(1, 'rgba(255,180,60,0)'); fx.fillStyle = rg; fx.fillRect(hx - 130, y - 20, 260, 260) }
      sparks(fx, 1000, y + 110, a - .7, x.i * 50) }
    if (x.st === 'title' || x.st === 'word' || x.st === 'number') x.tBig.forEach((tb, k) => { if (k === x.tBig.length - 1) { const r = x.bigs[k].getBoundingClientRect(); sparks(fx, r.right - 10, r.top + r.height * .3, t - tb - .1, x.i * 70 + k) } });
    if (x.st === 'diagram') { let lit = 0;
      x.nodes.forEach((n, k) => { const q = eOut((t - x.tNode[k]) / .35), bx = n.querySelector('.nbox'), lb = n.querySelector('.nlab');
        n.style.opacity = .35 + .65 * cl((t - x.t0) / .3); if (q > 0) lit = k;
        bx.style.borderColor = `rgba(255,207,90,${.35 + .65 * q})`; bx.style.color = `rgba(255,${207 + 30 * q | 0},${90 + 120 * q | 0},${.5 + .5 * q})`;
        bx.style.background = `rgba(255,207,90,${.03 + .2 * q})`; bx.style.boxShadow = `0 0 ${50 * q}px rgba(255,190,70,${.6 * q})`; lb.style.color = `rgba(255,235,200,${.55 + .45 * q})`;
        bx.style.transform = `scale(${1 + .15 * (1 - cl((t - x.tNode[k]) / .3)) * (q > 0 ? 1 : 0)})` });
      // line grows to the latest lit node
      const k1 = x.tNode.findIndex(tn => t < tn), seg = x.pts.length - 1; let frac;
      if (k1 === -1) frac = 1; else if (k1 === 0) frac = 0; else { const p0 = x.tNode[k1 - 1], p1 = x.tNode[k1]; frac = ((k1 - 1) + eIO((t - p0) / (p1 - p0))) / seg }
      x.path.style.strokeDasharray = x.plen; x.path.style.strokeDashoffset = x.plen * (1 - frac) }
    if (x.st === 'prompt') { const txt = x.b.prompt || '', n = Math.round(txt.length * cl((t - x.pt0) / (x.pt1 - x.pt0))), car = (Math.floor(t * 2.2) % 2 || n < txt.length) ? '<span style="color:#ffcf5a">▍</span>' : '';
      const hl = (x.b.highlight || []).reduce((s, w) => s.replace(esc(w), `<u>${esc(w)}</u>`), esc(txt.slice(0, n))); x.ptxt.innerHTML = hl + car;
      const q = t - x.tBtn; x.btn.style.boxShadow = q > 0 ? `0 0 ${60 * (1 - cl(q / .8))}px #ffcf5a` : 'none'; x.btn.style.transform = `scale(${q > 0 && q < .15 ? .92 : 1})` }
  });
  // subtitle: current spoken words, so the screen is never empty
  let sub = '';
  if (!END || t < END.t0) { const i = WORDS.findIndex(w => w.s <= t && t < w.e + .35); if (i >= 0) { const bi = WORDS[i].beat; let a0 = i; while (a0 > 0 && WORDS[a0 - 1].beat === bi && i - a0 < 3 && !/[.!?]$/.test(WORDS[a0 - 1].w)) a0--;
    const ws = WORDS.slice(a0, i + 1); sub = ws.map((w, k) => k === ws.length - 1 ? `<b>${esc(w.w)}</b>` : esc(w.w)).join(' ') } }
  const se = document.getElementById('sub'); se.innerHTML = sub; se.style.display = cur && cur.st === 'flash' ? 'none' : 'block';
  // end card
  if (END) { const on = t >= END.t0; END.el.style.display = on ? 'block' : 'none';
    if (on) { const q = t - END.t0; END.w.style.transform = `scale(${lerp(1.5, 1, eOut(q / .3))})`; END.w.style.backgroundPosition = `${lerp(100, 0, eIO((q - .2) / 1))}% 0`; punch = Math.max(punch, 1 - q / .35);
      const r = END.w.getBoundingClientRect(); sparks(fx, r.left + r.width / 2, r.top + r.height / 2, q - .05, 999) } }
  // camera: slow push + punch + shake
  const camEl = document.getElementById('cam'), pa = cur ? t - cur.t0 : 0, sh = punch > 0 ? punch * 7 : 0;
  camEl.style.transform = `translate(${Math.sin(t * 83) * sh}px,${Math.cos(t * 71) * sh}px) scale(${(1 + pa * .008) * (1 + punch * .05)})`;
  document.getElementById('sc').textContent = 'SCENE ' + String((cur ? cur.i : B.length) + 1).padStart(2, '0');
  if (cur && cur.b.hud) document.getElementById('lb').textContent = cur.b.hud;
  // hook clip
  const hk = document.getElementById('hook');
  if (HOOK && t < HOOK.dur) { hk.style.display = 'block'; const ht = document.getElementById('hooktxt'); ht.style.transform = `scale(${.7 + .3 * back(t / .25)})`;
    const v = document.getElementById('hookv'), want = Math.min(t, v.duration - .02); if (Math.abs(v.currentTime - want) < .001) return;
    return new Promise(res => { v.addEventListener('seeked', () => requestAnimationFrame(() => res()), { once: true }); v.currentTime = want }) }
  hk.style.display = 'none';
};
init().catch(e => { console.error(e); document.body.innerHTML = '<pre style="color:red;font-size:30px">' + e + '</pre>' });
