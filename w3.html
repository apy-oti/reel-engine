<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import {setup,THREE,CORAL,INK,CORALHEX,cl,lerp,eOut,eIn,eIO,eExpo,impulse,rng,rr} from './lib.js';
const S=await setup({sceneNo:3,total:4,tcOffset:12,title:'OWN THE INBOX - WHY EMAIL',bloom:[0.9,0.5,0.88]});const {scene,cam,word,canvasPlane,makePoints,bloom,fx}=S;const rnd=rng(303);
const riverX=z=>3.2*Math.sin(z*0.17+0.8)+1.2*Math.sin(z*0.41);
// homes
const H=[];let guard=0;
while(H.length<7000&&guard<200000){guard++;const x=(rnd()-.5)*30,z=-22+rnd()*30;
 const bx=((x%1.7)+1.7)%1.7,bz=((z%1.5)+1.5)%1.5;if(bx<0.32||bz<0.3)continue; // streets
 if(Math.abs(x-riverX(z))<1.1)continue; // river
 if(Math.hypot(x+5,z+9)<2.2||Math.hypot(x-6,z+2)<1.6)continue; // parks
 if(Math.hypot(x,z)<0.8)continue;
 const d=Math.hypot(x,z);if(rnd()<d/32)continue; // denser in center
 H.push({x,z,d})}
const NH=H.length,HP=makePoints(NH);{const p=HP.geometry.attributes.position.array,s=HP.geometry.attributes.size.array;H.forEach((h,i)=>{p.set([h.x,0,h.z],i*3);s[i]=0.4})}
// river
const NR=1400,RP=makePoints(NR);{const p=RP.geometry.attributes.position.array,c=RP.geometry.attributes.color.array,s=RP.geometry.attributes.size.array;
 for(let i=0;i<NR;i++){const z=-24+32*i/NR,w=(rnd()-.5)*1.4;p.set([riverX(z)+w,-0.02,z],i*3);c.set([.12,.22,.5],i*3);s[i]=0.45}}
// targets
const order=[...H.keys()].sort((a,b)=>H[a].d-H[b].d);const T=[];const maxD=H[order[order.length-1]].d;
for(let k=0;k<NH;k++){if(rnd()<0.36){const i=order[k];T.push({i,ta:2.15+2.85*Math.pow(H[i].d/maxD,0.85)+rnd()*0.12})}}
const NT=Math.min(T.length,2000);T.length=NT;const lit=new Float32Array(NH).fill(99);T.forEach(t=>lit[t.i]=t.ta);
// beams
const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NT*6),3));bg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(NT*6),3));
const BL=new THREE.LineSegments(bg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));BL.frustumCulled=false;scene.add(BL);
const BH=makePoints(NT);{const c=BH.geometry.attributes.color.array,s=BH.geometry.attributes.size.array;for(let i=0;i<NT;i++){c.set([1.3,1.2,1.1],i*3);s[i]=0.22}}
// returns
const R=[];for(let k=0;k<700;k++){const tt=T[Math.floor(rnd()*NT)];R.push({i:tt.i,t0:Math.max(tt.ta+0.4,6.9+rnd()*2.6)})}
const RH=makePoints(R.length);{const c=RH.geometry.attributes.color.array,s=RH.geometry.attributes.size.array;R.forEach((r,i)=>{c.set([CORAL.r*1.8,CORAL.g*1.8,CORAL.b*1.8],i*3);s[i]=0.3})}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(R.length*6),3));rg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(R.length*6),3));
const RL=new THREE.LineSegments(rg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));RL.frustumCulled=false;scene.add(RL);
const arc=(x,z,u,out)=>{const d=Math.hypot(x,z);out[0]=x*u;out[2]=z*u;out[1]=Math.sin(u*Math.PI)*(0.6+d*0.28);return out};
// shop beam
const beamTex=(()=>{const c=document.createElement('canvas');c.width=64;c.height=512;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'rgba(255,92,54,0)');g.addColorStop(.7,'rgba(255,92,54,.6)');g.addColorStop(1,'rgba(255,200,170,1)');
 x.fillStyle=g;x.fillRect(0,0,64,512);const h=x.createLinearGradient(0,0,64,0);h.addColorStop(0,'rgba(0,0,0,1)');h.addColorStop(.5,'rgba(0,0,0,0)');h.addColorStop(1,'rgba(0,0,0,1)');x.globalCompositeOperation='destination-out';x.fillStyle=h;x.fillRect(0,0,64,512);return new THREE.CanvasTexture(c)})();
const beam=new THREE.Mesh(new THREE.PlaneGeometry(0.5,9),new THREE.MeshBasicMaterial({map:beamTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));beam.position.y=4.5;scene.add(beam);
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);
 g.addColorStop(0,'rgba(255,230,210,1)');g.addColorStop(.2,'rgba(255,92,54,.8)');g.addColorStop(1,'rgba(255,92,54,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)})();
const core=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));scene.add(core);core.position.y=0.15;
const rings=[0,1,2].map(()=>{const m=new THREE.Mesh(new THREE.RingGeometry(0.95,1,96),new THREE.MeshBasicMaterial({color:CORAL,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;scene.add(m);return m});
const shopLbl=canvasPlane(600,120,1.8,x=>{x.font='54px MO';x.fillStyle='#ffb49c';x.textAlign='center';x.fillText('YOUR SHOP',300,80)});shopLbl.material.depthTest=false;
// camera-space UI
const tg=new THREE.Group();tg.position.z=-10;cam.add(tg);
const L1=word('ONE EMAIL.',{h:0.62,y:3.35,maxW:4.6,parent:tg}),L2=word('2,000 HOMES.',{h:0.62,y:2.55,maxW:4.6,parent:tg}),L3=word('3 SECONDS.',{h:0.62,y:1.75,maxW:4.6,color:CORALHEX,parent:tg});
const M1=word('THEN THEY',{h:0.62,y:3.35,maxW:4.6,parent:tg}),M2=word('COME BACK.',{h:0.9,y:2.45,maxW:4.6,color:CORALHEX,parent:tg});
const btn=canvasPlane(800,200,3.2,()=>{},tg);btn.position.set(0,-2.75,0);btn.material.color.setScalar(0.85);
tg.traverse(o=>{if(o.material){o.material.depthTest=false;o.renderOrder=100}});
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const TP=1.75;const v=new Array(3);const tmp=[0,0,0],tmp2=[0,0,0];const WARM=[1.6,1.0,0.65];
function txt(L,t0,t1,big){L.letters.forEach((m,j)=>{const q=eOut((t-t0-j*0.03)/0.35),o=cl((t1-t)/0.25);m.material.opacity=q*o;const r=m.userData.rest;m.position.set(r.x,r.y-(1-q)*0.4,0);m.rotation.x=(1-q)*1.3;
 const e=t-t0-j*0.03;m.scale.setScalar(e>0?1+(big?0.25:0.15)*Math.exp(-e*10)*Math.cos(e*30):1)})}
let t=0;
window.renderAt=tt=>{t=tt;
 const dive=eIn((t-10.9)/1.0);
 const ang=-0.35+t*0.06,rad=lerp(17,14,eIO(t/10)),hgt=lerp(15,11,eIO(t/10));
 cam.position.set(Math.sin(ang)*rad*(1-dive),lerp(hgt,0.6,dive),Math.cos(ang)*rad*(1-dive)+2*(1-dive));cam.lookAt(0,lerp(0,0.4,dive),lerp(-3,0,eIO(t/6))*(1-dive));
 cam.fov=50+dive*30;cam.updateProjectionMatrix();
 const sendHit=impulse(t,[TP],10);cam.position.y+=Math.sin(t*90)*sendHit*0.05;
 // homes
 const hc=HP.geometry.attributes.color.array,hs=HP.geometry.attributes.size.array;const intro=eOut(t/0.8);
 for(let i=0;i<NH;i++){const a=t-lit[i];let c;if(a<0){const b=0.36*intro;c=[b,b,b*1.08];hs[i]=0.4}else{const f=Math.exp(-a*4);c=[lerp(WARM[0],3,f),lerp(WARM[1],3,f),lerp(WARM[2],3,f)];hs[i]=0.5+f*0.5}
  hc[i*3]=c[0];hc[i*3+1]=c[1];hc[i*3+2]=c[2]}
 HP.geometry.attributes.color.needsUpdate=HP.geometry.attributes.size.needsUpdate=true;RP.material.uniforms.uA.value=intro;
 // beams out
 const bp=bg.attributes.position.array,bc=bg.attributes.color.array,hp=BH.geometry.attributes.position.array,hz=BH.geometry.attributes.size.array;
 T.forEach((b,k)=>{const h=H[b.i];const dur=b.ta-TP;const u=cl((t-TP)/dur);const live=t>TP&&t<b.ta+0.05;
  if(!live){bp.fill(0,k*6,k*6+6);bc.fill(0,k*6,k*6+6);hp.set([0,-50,0],k*3);hz[k]=0;return}
  const ue=eIO(u);arc(h.x,h.z,ue,tmp);arc(h.x,h.z,Math.max(0,ue-0.12),tmp2);bp.set([tmp[0],tmp[1],tmp[2],tmp2[0],tmp2[1],tmp2[2]],k*6);
  bc.set([1.3,0.75,0.55,0,0,0],k*6);hp.set(tmp,k*3);hz[k]=0.2});
 bg.attributes.position.needsUpdate=bg.attributes.color.needsUpdate=true;BH.geometry.attributes.position.needsUpdate=BH.geometry.attributes.size.needsUpdate=true;
 // returns
 const rp=rg.attributes.position.array,rc=rg.attributes.color.array,qp=RH.geometry.attributes.position.array,qs=RH.geometry.attributes.size.array;let arrivals=0;
 R.forEach((r,k)=>{const h=H[r.i];const u=cl((t-r.t0)/1.1);if(t<r.t0||u>=1){if(u>=1)arrivals++;rp.fill(0,k*6,k*6+6);rc.fill(0,k*6,k*6+6);qp.set([0,-50,0],k*3);qs[k]=0;return}
  const ue=1-eIO(u);arc(h.x,h.z,ue,tmp);arc(h.x,h.z,Math.min(1,ue+0.1),tmp2);rp.set([tmp[0],tmp[1],tmp[2],tmp2[0],tmp2[1],tmp2[2]],k*6);rc.set([CORAL.r*1.6,CORAL.g*1.6,CORAL.b*1.6,0,0,0],k*6);qp.set(tmp,k*3);qs[k]=0.3});
 rg.attributes.position.needsUpdate=rg.attributes.color.needsUpdate=true;RH.geometry.attributes.position.needsUpdate=RH.geometry.attributes.size.needsUpdate=true;
 // shop
 const pw=0.6+arrivals/R.length*1.6+sendHit*1.2;beam.material.opacity=cl(eOut((t-0.3)/0.6))*Math.min(1,pw);beam.scale.set(1+arrivals/R.length*2.2,1+arrivals/R.length*0.4,1);
 beam.lookAt(cam.position.x,beam.position.y,cam.position.z);
 core.scale.setScalar((1.6+arrivals/R.length*3+sendHit*3+Math.sin(t*6)*0.15)*cl(t/0.5));
 rings.forEach((m,i)=>{const ph=((t*0.7+i/3)%1);m.scale.setScalar(0.5+ph*(3+arrivals/R.length*5));m.material.opacity=(1-ph)*0.7*cl(t/0.6)});
 shopLbl.position.set(0,1.2+Math.sin(t*2)*0.05,0);shopLbl.lookAt(cam.position);shopLbl.material.opacity=eOut((t-0.4)/0.5)*(1-cl((t-1.9)/0.3));
 // texts
 txt(L1,2.05,6.45,false);txt(L2,2.6,6.45,false);txt(L3,3.15,6.45,true);txt(M1,6.95,10.9,false);txt(M2,7.3,10.9,true);
 // button / counter
 const ba=eOut((t-0.7)/0.4)*(1-dive);btn.material.opacity=ba;const press=t>TP-0.12&&t<TP+0.1?0.9:1;btn.scale.setScalar(press*(1+sendHit*0.08));
 const reached=Math.round(NT*cl(T.filter(b=>b.ta<=t).length/NT));
 btn.userData.redraw(x=>{if(t<TP+0.25){x.fillStyle=t>=TP?'#b8402a':CORALHEX;rr(x,10,10,780,180,90);x.fill();x.fillStyle='#fff';x.font='78px IB';x.textAlign='center';x.fillText('SEND',400,128)}
  else{x.textAlign='center';x.font='30px MO';x.fillStyle='#8a8a94';x.fillText(t<6.6?'HOMES REACHED':'ORDERS COMING IN',400,44);x.font='120px IB';x.fillStyle='#f3f1eb';
   if(t<6.6)x.fillText(fmt(reached),400,170);else{for(let k=0;k<5;k++){const ph=(t*2.2-k*0.35)%1;x.globalAlpha=0.3+0.7*Math.max(0,Math.sin(ph*Math.PI));x.fillStyle=CORALHEX;x.font='96px IB';x.fillText('€',160+k*120,160)}x.globalAlpha=1}}});
 bloom.strength=0.9+sendHit*1.2+dive*2;fx.uniforms.uCA.value=0.0015+sendHit*0.02+dive*0.06;
 S.render(t);S.hud(t,t<6.6?'CITY / BROADCAST':'CITY / RETURN',eOut(t/0.3)*(1-dive));
 S.flash(cl((t-11.7)/0.15),'#fff');
};
window.READY=true;
</script></body></html>
