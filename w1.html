<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import {setup,THREE,CORAL,INK,CORALHEX,cl,lerp,eOut,eIn,eIO,eExpo,impulse,rng,rr} from './lib.js';
const S=await setup({sceneNo:1,total:4,tcOffset:0,title:'OWN THE INBOX - WHY EMAIL'});const {scene,cam,word,canvasPlane,bloom,fx}=S;
cam.position.set(0,0,10);cam.lookAt(0,0,0);
const tg=new THREE.Group();tg.position.z=-10;cam.add(tg);
// wallpaper: full frame plane (visible 5.25 x 9.33 at d=10)
const wall=canvasPlane(540,960,5.4,()=>{},tg);wall.position.z=-0.01;
function drawWall(x,t){const g=x.createLinearGradient(0,0,540,960);g.addColorStop(0,'#14122a');g.addColorStop(1,'#07070c');x.fillStyle=g;x.fillRect(0,0,540,960);
 const blobs=[[160+Math.sin(t*0.8)*30,300,260,'rgba(255,92,54,0.55)'],[420,620+Math.cos(t*0.6)*30,300,'rgba(90,70,220,0.5)'],[260,820,220,'rgba(255,150,90,0.35)']];
 for(const [bx,by,br,c] of blobs){const rg=x.createRadialGradient(bx,by,0,bx,by,br);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(0,0,540,960)}}
const clock=canvasPlane(1000,420,4.6,x=>{x.textAlign='center';x.fillStyle='rgba(255,255,255,0.92)';x.font='44px IM';x.fillText('Tuesday, 14 October',500,70);x.font='250px ISB';x.fillText('9:41',500,330)},tg);clock.position.set(0,2.55,0);
const note=canvasPlane(1000,300,4.7,x=>{x.fillStyle='rgba(245,243,238,0.94)';rr(x,6,6,988,288,56);x.fill();
 x.fillStyle=CORALHEX;rr(x,40,52,120,120,30);x.fill();x.strokeStyle='#fff';x.lineWidth=8;x.lineJoin='round';rr(x,66,86,68,52,8);x.stroke();x.beginPath();x.moveTo(70,92);x.lineTo(100,116);x.lineTo(130,92);x.stroke();
 x.fillStyle='#111';x.font='44px IBD';x.fillText('Corner Bakery',190,92);x.fillStyle='#8a8a94';x.font='34px IM';x.textAlign='right';x.fillText('now',950,90);x.textAlign='left';
 x.fillStyle='#222';x.font='38px IM';x.fillText('Fresh croissants out of the oven.',190,150);x.fillText('2 for 1, today only. See you soon!',190,200);
 x.fillStyle='#8a8a94';x.font='30px IM';x.fillText('Email',190,252)},tg);
note.renderOrder=3;note.material.color.setScalar(0.9);
const a1=word('THIS IS EMAIL.',{h:0.62,y:0.15,maxW:4.6,parent:tg}),a2=word('NO ALGORITHM.',{h:0.62,y:-0.75,maxW:4.6,color:CORALHEX,parent:tg});
tg.traverse(o=>{if(o.material){o.material.depthTest=false;if(o.renderOrder===0)o.renderOrder=2}});
[...a1.letters,...a2.letters].forEach(m=>m.renderOrder=5);
const TB=0.45,TG=1.55;
window.renderAt=t=>{
 wall.userData.redraw(x=>drawWall(x,t));
 // buzz shake
 const buzz=t>TB&&t<TB+0.5?Math.sin(t*180)*0.035*(1-(t-TB)/0.5):0;
 const out=eIn((t-3.05)/0.45);
 cam.position.set(buzz,0,10-out*6);cam.lookAt(buzz,0,-10);cam.rotation.z=out*0.3;
 const p=eExpo((t-TB)/0.5);const back=t>TB?1+0.04*Math.exp(-(t-TB)*7)*Math.sin((t-TB)*20):1;
 note.position.set(0,lerp(5.6,0.3,p),0.01);note.scale.setScalar(back);note.material.opacity=cl(p*2);
 // after glitch: lock screen dims & pushes back, note lifts up
 const g=eIO((t-TG)/0.5);
 wall.material.opacity=1-g*0.82;clock.material.opacity=1-g;clock.position.y=2.55+g*0.6;
 note.position.y+=g*2.05;note.scale.multiplyScalar(lerp(1,0.92,g));
 [a1,a2].forEach((L,li)=>L.letters.forEach((m,j)=>{const q=eOut((t-TG-0.25-li*0.4-j*0.022)/0.32);m.material.opacity=q*(1-out);const r=m.userData.rest;
  m.position.set(r.x,r.y-(1-q)*0.4,0);m.rotation.x=(1-q)*1.3;const e=t-TG-0.25-li*0.4-j*0.022;m.scale.setScalar(e>0?1+0.2*Math.exp(-e*10)*Math.cos(e*30):1)}));
 const gl=cl(1-Math.abs(t-TG-0.12)/0.2);
 fx.uniforms.uGl.value=gl*0.8;fx.uniforms.uCA.value=0.0015+gl*0.05+out*0.05+impulse(t,[TB],12)*0.01;
 bloom.strength=0.6+out*1.5;
 S.render(t);S.hud(t,t<TG?'LOCK / NOTIFY':'SIGNAL / INBOX',g*(1-out));
 S.flash(cl((t-3.35)/0.1),'#fff');
};
window.READY=true;
</script></body></html>
