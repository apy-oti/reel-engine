name: Build reels

on:
  push:
    branches: [main]
    paths: ["reels/**"]
  workflow_dispatch:
    inputs:
      reel:
        description: "Folder to build, e.g. reels/2026-11-test-nl-promo (empty = all changed in last commit)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick reels to build
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.reel }}" ]; then
            echo "${{ github.event.inputs.reel }}" > reels.txt
          else
            git diff --name-only HEAD~1 HEAD -- reels/ | cut -d/ -f1-2 | sort -u > reels.txt || true
          fi
          # only folders that have a reel.json
          : > todo.txt
          while read -r d; do [ -f "$d/reel.json" ] && echo "$d" >> todo.txt; done < reels.txt
          echo "Building:"; cat todo.txt
          echo "count=$(wc -l < todo.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.count != '0'
        with:
          node-version: 20

      - name: Install tools
        if: steps.pick.outputs.count != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore voice and sound cache
        if: steps.pick.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: .cache
          key: el-cache-${{ github.run_id }}
          restore-keys: el-cache-

      - name: Build
        if: steps.pick.outputs.count != '0'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          JOBS: "4"
        run: |
          mapfile -t R < todo.txt
          for d in "${R[@]}"; do python3 build_reel.py "$d" < /dev/null; done

      - name: Upload videos
        if: steps.pick.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: out/*.mp4
          retention-days: 90

      - name: Publish videos (public links for Metricool)
        if: steps.pick.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in out/*.mp4; do
            id=$(basename "$f" .mp4)
            gh release view "$id" >/dev/null 2>&1 || gh release create "$id" --title "$id" --notes "Reel $id" --latest=false
            gh release upload "$id" "$f" --clobber
            echo "PUBLIC_URL https://github.com/${{ github.repository }}/releases/download/$id/$id.mp4"
          done

      - name: Remember used hooks
        if: steps.pick.outputs.count != '0'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add hooks/used.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update used hooks [skip ci]"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
