<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import {setup,THREE,CORAL,INK,CORALHEX,cl,lerp,eOut,eIn,eIO,eExpo,impulse,rng,rr} from './lib.js';
const S=await setup({sceneNo:4,tcOffset:15});const {scene,cam,word,canvasPlane,makePoints,bloom,fx}=S;const rnd=rng(44);
// euro rain
const ec=document.createElement('canvas');ec.width=ec.height=128;{const x=ec.getContext('2d');x.font='110px IB';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText('€',64,70)}
const etex=new THREE.CanvasTexture(ec);const NR=600,RA=makePoints(NR,scene,etex);const RD=[];
for(let i=0;i<NR;i++)RD.push({x:(rnd()-.5)*16,z:-4-rnd()*30,y0:rnd()*30,v:2+rnd()*3,s:2+rnd()*4,on:rnd(),c:rnd()<.45});
{const c=RA.geometry.attributes.color.array;RD.forEach((d,i)=>c.set(d.c?[CORAL.r*.7,CORAL.g*.7,CORAL.b*.7]:[.32,.3,.28],i*3))}
// notifications
const ORD=[['#1042','86,40'],['#1043','129,00'],['#1044','54,90'],['#1045','212,50'],['#1046','38,00'],['#1047','97,20'],['#1048','164,80'],['#1049','72,00'],
 ['#1050','245,00'],['#1051','61,30'],['#1052','118,90'],['#1053','89,00'],['#1054','310,40'],['#1055','47,60']];
const FLOWS=['Welkomstreeks','Verlaten winkelmand','Win-back','Bekeken, niet gekocht'];
const NOT=ORD.map(([id,amt],i)=>{const m=canvasPlane(1000,190,4.5,x=>{x.fillStyle='rgba(32,32,38,0.96)';rr(x,4,4,992,182,44);x.fill();
  x.strokeStyle='rgba(255,255,255,0.08)';x.lineWidth=3;rr(x,4,4,992,182,44);x.stroke();
  x.fillStyle=CORALHEX;rr(x,36,40,110,110,28);x.fill();x.fillStyle='#fff';x.font='70px IB';x.textAlign='center';x.fillText('€',91,122);x.textAlign='left';
  x.fillStyle='#f3f1eb';x.font='46px IBD';x.fillText('Nieuwe bestelling '+id,176,88);
  x.fillStyle='#9a9aa4';x.font='34px IM';x.fillText('€'+amt+'  ·  via '+FLOWS[i%4],176,140);
  x.fillStyle='#6b6b74';x.font='28px IM';x.textAlign='right';x.fillText('nu',956,80)});
 m.renderOrder=5;return m});
const nt=ORD.map((_,i)=>0.35+3.6*(1-Math.pow(1-i/ORD.length,1.8)));
// counter
const counter=canvasPlane(1200,520,6.8,()=>{});counter.renderOrder=6;
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function drawCounter(x,v){x.textAlign='center';x.font='34px MO';x.fillStyle='#8a8a94';x.fillText('OMZET UIT E-MAIL  ·  VOORBEELDWINKEL',600,70);
 const s='€'+fmt(Math.floor(v));x.font='230px IB';const w=x.measureText(s).width;let cx=600-w/2;x.textAlign='left';
 // odometer roll per digit
 const digits=String(Math.floor(v));let place=digits.length-1;
 for(const ch of s){const cw=x.measureText(ch).width;
  if(/\d/.test(ch)){const pw=Math.pow(10,place);let fr=place===0?(v%1):cl((v%pw)-(pw-1));const d=parseInt(ch);
   x.save();x.beginPath();x.rect(cx-5,150,cw+10,250);x.clip();x.fillStyle=place<2&&v<12480?CORALHEX:'#f3f1eb';
   x.fillText(String(d),cx,370-fr*230);x.fillText(String((d+1)%10),cx,370-fr*230+230);x.restore();place--}
  else{x.fillStyle='#f3f1eb';x.fillText(ch,cx,370)}cx+=cw}
 x.textAlign='center';x.font='30px MO';x.fillStyle='#8a8a94';x.fillText('LAATSTE 30 DAGEN',600,470)}
const tg=new THREE.Group();tg.position.z=-10;cam.add(tg);
const w1=word('TERWIJL JIJ',{h:0.6,y:-2.15,maxW:4.6,parent:tg}),w2=word('SLAAPT.',{h:0.95,y:-3.02,maxW:4.6,color:CORALHEX,parent:tg});
tg.traverse(o=>{if(o.material){o.material.depthTest=false;o.renderOrder=10}});
// burst
const NB=500,BU=makePoints(NB,scene,etex),BD=[];for(let i=0;i<NB;i++){const a=rnd()*Math.PI*2,e=rnd()*1.4-0.7;BD.push({vx:Math.cos(a)*Math.cos(e),vy:Math.sin(a)*Math.cos(e),vz:Math.sin(e),sp:3+rnd()*9,s:2+rnd()*3,c:rnd()<.6})}
{const c=BU.geometry.attributes.color.array;BD.forEach((d,i)=>c.set(d.c?[CORAL.r*1.3,CORAL.g*1.3,CORAL.b*1.3]:[1.1,1.05,1],i*3))}
const TB=5.15;
window.renderAt=t=>{
 const out=eIn((t-6.55)/0.45);
 const sh=impulse(t,nt,20)*0.025+impulse(t,[TB],7)*0.22;
 cam.position.set(Math.sin(t*0.5)*0.5+Math.sin(t*93)*sh,Math.cos(t*79)*sh,lerp(12.5,11,eIO(t/6.5))-out*9);cam.lookAt(0,0.4,0);cam.rotation.z+=Math.sin(t*0.6)*0.02+out*0.4;
 // rain
 const rp=RA.geometry.attributes.position.array,rs=RA.geometry.attributes.size.array;const dens=lerp(0.15,1,eIO((t-0.3)/5));
 RD.forEach((d,i)=>{const y=12-((d.y0+t*d.v*(1+eIn((t-4.5)/1.5)*2))%30);rp.set([d.x,y,d.z],i*3);rs[i]=d.on<dens?d.s:0});RA.geometry.attributes.position.needsUpdate=RA.geometry.attributes.size.needsUpdate=true;
 // notifications: newest at top, stack shifts down
 NOT.forEach((m,i)=>{const a=t-nt[i];if(a<0){m.visible=false;return}m.visible=true;const p=eExpo(a/0.35);
  let sf=0;for(let j=i+1;j<nt.length;j++)sf+=eExpo((t-nt[j])/0.3);
  m.position.set(0,lerp(5.9,4.25,p)-sf*1.0,-sf*0.5);m.scale.setScalar(lerp(0.85,1,p));
  m.material.opacity=cl(p*2)*cl(1-(sf-2.2)/0.8)*(1-cl((t-5.0)/0.35))});
 // counter
 const v=12480*eIO((t-0.5)/4.6);counter.position.set(0,-0.15,0.5);
 const hit=impulse(t,[TB],6);counter.scale.setScalar((1+hit*0.18)*lerp(0.9,1,eOut(t/0.5)));counter.material.opacity=eOut(t/0.4);
 counter.userData.redraw(x=>drawCounter(x,v));
 // burst
 const bp=BU.geometry.attributes.position.array,bs=BU.geometry.attributes.size.array;const ba=t-TB;
 BD.forEach((d,i)=>{if(ba<0){bs[i]=0;return}const r=d.sp*eOut(ba/1.4)*1.0;bp.set([d.vx*r,0.15+d.vy*r-ba*ba*0.6,0.5+d.vz*r],i*3);bs[i]=d.s*cl(1-ba/1.6)});
 BU.geometry.attributes.position.needsUpdate=BU.geometry.attributes.size.needsUpdate=true;
 // text
 [w1,w2].forEach((L,li)=>L.letters.forEach((m,j)=>{const p=eOut((t-5.35-li*0.3-j*0.03)/0.4);m.material.opacity=p*(1-out);const r=m.userData.rest;m.position.set(r.x,r.y-(1-p)*0.45,0);m.rotation.x=(1-p)*1.3}));
 bloom.strength=0.75+hit*1.4+out*1.5;fx.uniforms.uCA.value=0.0015+hit*0.03+out*0.06;
 S.render(t);S.hud(t,t<TB?'ORDERS / STREAM':'REVENUE / BURST',eOut(t/0.3)*(1-out));
 S.flash(cl((t-TB)/0.04)*(1-cl((t-TB-0.04)/0.25))*0.85,'#fff');
 if(t>6.8)S.flash(cl((t-6.8)/0.1),'#000');
};
window.READY=true;
</script></body></html>
